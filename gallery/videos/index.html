<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Videos — Agar Main King Hota</title>
<meta name="description" content="Shah Rukh Khan videos: songs, trailers, scenes, making-of, TV shows, awards and stage. Search by film, year and genre.">
<meta name="theme-color" content="#0a0707">
<link rel="canonical" href="https://agarmainkinghota.com/gallery/videos/">
<link rel="icon" type="image/png" href="../../assets/home/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../assets/v2.css">
<link rel="stylesheet" href="../../assets/vgrid.css">
</head>
<body class="v2">
<script src="../../assets/header.js"></script>
<script src="../../assets/section-nav.js"></script>
<main class="wrap">
  <div class="page-head"><div><p class="eyebrow">Gallery</p><h1>SRK <em>Videos</em></h1></div><p>Songs, trailers, scenes, making-of, TV shows, awards and stage, and full movies free on YouTube. Pick a section, then search by film, year or genre.</p></div>
  <div class="vtabs" id="chips" role="group" aria-label="Video sections">
    <button type="button" data-f="Songs" aria-pressed="true">Songs <span></span></button>
    <button type="button" data-f="Trailers" aria-pressed="false">Trailers <span></span></button>
    <button type="button" data-f="Scenes" aria-pressed="false">Scenes <span></span></button>
    <button type="button" data-f="Making Of" aria-pressed="false">Making Of <span></span></button>
    <button type="button" data-f="Shows" aria-pressed="false">Shows <span></span></button>
    <button type="button" data-f="Awards & Stage" aria-pressed="false">Awards &amp; Stage <span></span></button>
    <button type="button" data-f="Full Movies" aria-pressed="false">Full Movies <span></span></button>
  </div>
  <div class="vg-bar vbar">
    <input type="search" id="q" placeholder="Search songs" aria-label="Search">
    <select id="film" aria-label="Film"></select>
    <select id="year" aria-label="Year"></select>
    <select id="genre" aria-label="Genre"></select>
    <select id="sort" aria-label="Sort"><option value="views">Most viewed</option><option value="yr">Newest film first</option><option value="yrold">Oldest film first</option></select>
  </div>
  <p class="vcount" id="vcount"></p>
  <section class="vg" id="grid" aria-label="Videos"><p class="note">Loading…</p></section>
  <p class="note vg-src" id="src"></p>
</main>
<style>
.vtabs{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:8px;margin:6px 0 14px}
.vtabs button{font:400 18px/1.1 var(--display,Anton),sans-serif;letter-spacing:.04em;text-transform:uppercase;padding:16px 10px;background:var(--panel);border:1px solid var(--line);color:#efe6df;cursor:pointer;text-align:left}
.vtabs button span{display:block;font:600 11.5px var(--body);letter-spacing:.12em;color:var(--mute);margin-top:6px}
.vtabs button[aria-pressed=true]{background:var(--red);border-color:var(--red);color:#fff}
.vtabs button[aria-pressed=true] span{color:#ffe1dc}
.vbar{display:grid;grid-template-columns:2fr 1.4fr 1fr 1fr 1.2fr;gap:8px;margin-bottom:8px}
.vbar input,.vbar select{min-width:0;width:100%;background:#0d0909;border:1px solid var(--line);color:#efe6df;font:500 14px var(--body);padding:10px 12px}
.vbar input:focus,.vbar select:focus{outline:none;border-color:var(--red)}
.vcount{margin:4px 0 12px;color:var(--mute);font-size:13px}
@media(max-width:1100px){.vtabs{grid-template-columns:repeat(4,minmax(0,1fr))}}@media(max-width:900px){.vtabs{grid-template-columns:repeat(3,minmax(0,1fr))}.vbar{grid-template-columns:1fr 1fr}.vbar input{grid-column:1/-1}}
@media(max-width:480px){.vtabs button{font-size:16px;padding:12px 8px}}
</style>
<script src="../../assets/vgrid.js"></script>
<script>
(function(){
var $=function(i){return document.getElementById(i);}, fs=$('film'), ys=$('year'), gs=$('genre'), q=$('q'), all=[], cur='Songs';
var SHOWCAT={'Shows':1,'Awards & Stage':1};
var H={'songs':'Songs','trailers':'Trailers','scenes':'Scenes','making-of':'Making Of','shows':'Shows','awards-stage':'Awards & Stage','full-movies':'Full Movies'};
var h=(location.hash||'').slice(1); if(H[h]) cur=H[h];
function key(it){return SHOWCAT[it.cat]?(it.show||''):(it.film||'');}
function opts(sel,label,vals,keep){var v=keep?sel.value:'';sel.innerHTML='<option value="">'+label+'</option>'+vals.map(function(x){return '<option value="'+x[0].replace(/"/g,'&quot;')+'">'+x[0]+' ('+x[1]+')</option>';}).join('');if(vals.some(function(x){return x[0]===v;}))sel.value=v;}
function count(L,f){var c={};L.forEach(function(i){var k=f(i);if(k)c[k]=(c[k]||0)+1;});return c;}
function fill(){
  var L=all.filter(function(i){return i.cat===cur;}), sh=SHOWCAT[cur];
  var fc=count(L,key), yc=count(L,function(i){return i.year?String(i.year):'';}), gc=count(L,function(i){return i.genre||'';});
  var fy={};L.forEach(function(i){if(i.film&&i.year)fy[i.film]=i.year;});
  opts(fs,sh?'All shows':'All films',Object.keys(fc).sort(sh?function(a,b){return fc[b]-fc[a];}:function(a,b){return (fy[a]||0)-(fy[b]||0);}).map(function(k){return [k,fc[k]];}));
  opts(ys,'All years',Object.keys(yc).sort().reverse().map(function(k){return [k,yc[k]];}));
  opts(gs,'All genres',Object.keys(gc).sort().map(function(k){return [k,gc[k]];}));
  gs.style.display=sh?'none':''; q.placeholder='Search '+cur.toLowerCase();
}
function ok(it){return it.cat===cur&&(!fs.value||key(it)===fs.value)&&(!ys.value||String(it.year)===ys.value)&&(!gs.value||it.genre===gs.value);}
var g=VGrid({data:'../../data/srk-videos.json', grid:'#grid', chips:'#chips', q:'#q', sort:'#sort', src:'#src', start:cur,
  filter:function(it){var r=ok(it);return r;},
  subFn:function(it){return SHOWCAT[it.cat]?[it.show,it.year].filter(Boolean).join(' · '):[it.film,it.year,it.genre].filter(Boolean).join(' · ');},
  metaFn:function(it,fmt,short){return [(it.views!=null?short(it.views)+' views':''),it.length].filter(Boolean).join(' · ');},
  onLoad:function(items){all=items;var c=count(items,function(i){return i.cat;});[].forEach.call(document.querySelectorAll('#chips button'),function(b){var k=b.getAttribute('data-f');b.querySelector('span').textContent=(c[k]||0).toLocaleString('en-US')+' videos';b.setAttribute('aria-pressed',k===cur?'true':'false');});fill();tally();},
  onChip:function(f){cur=f;q.value='';fill();var slug=Object.keys(H).filter(function(k){return H[k]===f;})[0];try{history.replaceState(null,'','#'+slug);}catch(e){}setTimeout(tally,0);}});
function tally(){var w=(q.value||'').toLowerCase().trim().split(/\s+/).filter(Boolean);var n=all.filter(function(it){return ok(it)&&w.every(function(x){return (it.title+' '+(it.channel||'')+' '+(it.film||'')+' '+(it.year||'')+' '+(it.genre||'')+' '+(it.show||'')).toLowerCase().indexOf(x)>=0;});}).length;$('vcount').textContent=n.toLocaleString('en-US')+' '+cur.toLowerCase()+(fs.value?' · '+fs.value:'')+(ys.value?' · '+ys.value:'')+(gs.value?' · '+gs.value:'');}
[fs,ys,gs].forEach(function(s){s.addEventListener('change',function(){g.render();tally();});});
q.addEventListener('input',function(){setTimeout(tally,0);});
})();
</script>
<script src="../../assets/footer.js" defer></script>
</body>
</html>
