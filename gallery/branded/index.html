<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Branded — Agar Main King Hota</title>
<meta name="description" content="Branded: advertisements starring Shah Rukh Khan on YouTube, brand by brand, plus print ads and campaigns, all linked to the original.">
<meta name="theme-color" content="#0a0707">
<link rel="canonical" href="https://agarmainkinghota.com/gallery/branded/">
<link rel="icon" type="image/png" href="../../assets/home/favicon-64.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../../assets/site.css">
<link rel="stylesheet" href="../../assets/v2.css">
<link rel="stylesheet" href="../../assets/vgrid.css">
</head>
<body class="v2">
<script src="../../assets/header.js"></script>
<main class="wrap">
  <div class="page-head"><div><p class="eyebrow">Gallery</p><h1><em>Branded</em></h1></div><p>His advertisements on YouTube, brand by brand. Every card opens the original upload. Print ads and campaigns are linked at the end.</p></div>
  <div class="vg-stats" id="stats"></div>
  <div class="vg-bar">
    <div class="chips" id="chips" role="group" aria-label="Filter ads">
      <button type="button" data-f="all" aria-pressed="true">All uploads</button>
      <button type="button" data-f="official" aria-pressed="false">Brand channels only</button>
    </div>
    <div class="vg-tools">
      <select id="brand" aria-label="Brand"><option value="">All brands</option></select>
      <input type="search" id="q" placeholder="Search" aria-label="Search ads">
      <select id="sort" aria-label="Sort"><option value="views">Most viewed</option><option value="new">Newest</option><option value="az">Brand A-Z</option></select>
    </div>
  </div>
  <section class="vg" id="grid" aria-label="SRK advertisements"><p class="note">Loading…</p></section>
  <p class="sec-k">Print ads and campaigns</p>
  <ul class="tl" id="print"></ul>
  <p class="note vg-src" id="src"></p>
</main>
<style>.tl{list-style:none;margin:0;padding:0;display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px}.tl li a{display:block;padding:12px 14px;background:var(--panel);border:1px solid var(--line);color:#efe6df;text-decoration:none}.tl li a:hover{border-color:var(--red)}.tl b{display:block;font:600 14.5px/1.4 var(--body)}.tl small{color:var(--mute);font-size:12px;letter-spacing:.04em}.sec-k{margin:34px 0 10px;font:700 12px var(--body);letter-spacing:.2em;text-transform:uppercase;color:var(--red-text)}@media(max-width:700px){.tl{grid-template-columns:1fr}}</style>
<script src="../../assets/vgrid.js"></script>
<script>
var bsel=document.getElementById('brand');
VGrid({data:'../../data/srk-ads.json', grid:'#grid', stats:'#stats', chips:'#chips', q:'#q', sort:'#sort', src:'#src',
  filter:function(it,f){return (f==='all'||it.official)&&(!bsel.value||it.brand===bsel.value);},
  metaFn:function(it,fmt,short){return it.brand+' · '+(it.views!=null?short(it.views)+' views':'views N/A')+(it.age?' · '+it.age:'');},
  statsFn:function(items,fmt){var b={},v=0,o=0;items.forEach(function(i){b[i.brand]=(b[i.brand]||0)+1;v+=i.views||0;if(i.official)o++;i.sortKey=i.brand+' '+i.title;});
    Object.keys(b).sort().forEach(function(k){var op=document.createElement('option');op.value=k;op.textContent=k+' ('+b[k]+')';bsel.appendChild(op);});
    return [[fmt(items.length),'ad videos'],[fmt(Object.keys(b).length),'brands'],[fmt(v),'views in total'],[fmt(o),'on brand channels']];}});
bsel.addEventListener('change',function(){document.getElementById('q').dispatchEvent(new Event('input'));});
fetch('../../data/srk-ads.json').then(function(r){return r.json();}).then(function(d){var e=function(t){return String(t).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});};
document.getElementById('print').innerHTML=(d.print||[]).map(function(p){return '<li><a href="'+e(p.url)+'" target="_blank" rel="noopener"><small>'+e(p.kind)+' · '+e(p.outlet)+'</small><b>'+e(p.title)+'</b></a></li>';}).join('');});
</script>
<script src="../../assets/footer.js" defer></script>
</body>
</html>
