<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>KING INTELLIGENCE</title>
<style>
html,body{margin:0;background:#02070b;color:#fff;font-family:Arial,sans-serif}body{min-height:100vh;display:flex;justify-content:center;overflow:auto}
.stage{position:relative;width:min(1536px,100vw);aspect-ratio:1536/1024;background:#02070b url('./ui-master.webp') center/100% 100% no-repeat;box-shadow:0 0 60px #000;flex:none}
.hot{position:absolute;border:1px solid transparent;background:transparent;cursor:pointer;border-radius:8px;z-index:4;transition:background .16s ease,border-color .16s ease,box-shadow .16s ease,transform .16s ease}.hot::after{content:"";position:absolute;inset:0;border-radius:8px;pointer-events:none}.hot:hover{background:rgba(242,185,71,.12);border-color:rgba(242,185,71,.9);box-shadow:inset 0 0 0 1px rgba(255,255,255,.08),0 0 18px rgba(242,185,71,.18);transform:translateY(-1px)}.hot:hover::after{box-shadow:inset 0 0 28px rgba(242,185,71,.12)}.hot:focus-visible{outline:2px solid #16c8ee;outline-offset:2px}.hot::before{content:"CLICK";position:absolute;left:50%;top:8px;transform:translateX(-50%) translateY(-4px);opacity:0;padding:4px 7px;border:1px solid rgba(242,185,71,.75);border-radius:4px;background:#07131c;color:#f2b947;font:9px/1 monospace;letter-spacing:.12em;pointer-events:none;transition:opacity .12s ease,transform .12s ease;white-space:nowrap}.hot:hover::before{opacity:1;transform:translateX(-50%) translateY(0)}
.hnav{top:0;height:4.5%;}.ticker{top:4.8%;height:5.8%}.left1{left:.8%;top:10.8%;width:29%;height:14%}.left2{left:.8%;top:28%;width:29%;height:14%}.left3{left:.8%;top:42.5%;width:29%;height:14%}.left4{left:.8%;top:57%;width:29%;height:14%}
.center{left:29.7%;top:10.8%;width:41.8%;height:60%}.right1{right:.8%;top:10.8%;width:27.5%;height:27.5%}.right2{right:.8%;top:39%;width:27.5%;height:14%}.right3{right:.8%;top:53.5%;width:27.5%;height:18%}
.cards{left:.8%;right:.8%;top:71.7%;height:16.7%;}.timeline{left:.8%;right:.8%;top:88.7%;height:6.2%}.footer{left:.8%;right:.8%;bottom:.2%;height:4.8%}
.drawer{position:fixed;inset:0;background:rgba(0,0,0,.72);backdrop-filter:blur(5px);display:none;z-index:10}.drawer.open{display:flex;justify-content:flex-end}.box{width:min(720px,92vw);height:100%;overflow:auto;background:#061019;border-left:1px solid #3d5966;padding:28px;box-sizing:border-box;box-shadow:-30px 0 80px #000}.close{float:right;background:#0b1822;color:#fff;border:1px solid #36515f;padding:8px 12px;cursor:pointer}.ey{font:10px monospace;color:#f2b947;letter-spacing:.12em}.box h1{font-family:Georgia,serif;font-size:34px;margin:8px 0 20px}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.stat{background:#0b1823;border:1px solid #24404e;padding:14px}.stat b{font-size:22px}.stat span{display:block;font:9px monospace;color:#9aaab2;margin-top:5px}.box p,.box li{line-height:1.5;color:#c8d1d6}.box table{width:100%;border-collapse:collapse;font-size:12px}.box th,.box td{padding:7px;border-bottom:1px solid #1c303b;text-align:left}.box th{color:#f2b947;font:9px monospace}
@media(max-width:800px){.stage{width:1536px;transform-origin:top left}}
</style></head>
<body>
<div class="stage" aria-label="KING Intelligence visual command dashboard">
<button class="hot hnav" style="left:0;width:100%" data-k="NAVIGATION"></button>
<button class="hot ticker" style="left:.8%;width:48.6%" data-k="BIRTHDAY BUZZ"></button>
<button class="hot ticker" style="right:.8%;width:48.6%" data-k="KING BUZZ"></button>
<button class="hot left1" data-k="LIVE ATTENTION"></button><button class="hot left2" data-k="SENTIMENT ANALYSIS"></button><button class="hot left3" data-k="TOP CONVERSATION THEMES"></button><button class="hot left4" data-k="DOOM / RDJ"></button>
<button class="hot center" data-k="THE MYTH"></button>
<button class="hot right1" data-k="GLOBAL PRESENCE"></button><button class="hot right2" data-k="CITY ACTIVITY"></button><button class="hot right3" data-k="CONVERSATION CLOUD"></button>
<button class="hot cards" data-k="MODULES"></button><button class="hot timeline" data-k="HISTORICAL TIMELINE"></button><button class="hot footer" data-k="METHODOLOGY"></button>
</div>
<div class="drawer" id="drawer"><div class="box"><button class="close" onclick="closeD()">CLOSE ×</button><div id="body"></div></div></div>
<script>
const D={
"NAVIGATION":{k:"COMMAND NAVIGATION",t:"KING INTELLIGENCE",s:[["13","INTELLIGENCE MODULES"],["28","DAYS TO BIRTHDAY"],["80","DAYS TO KING"]],p:"The visible navigation remains exactly as designed in the master graphic. Interactive zones are layered invisibly over the artwork."},
"BIRTHDAY BUZZ":{k:"02 NOVEMBER 2026",t:"SRK BIRTHDAY BUZZ",s:[["28","DAYS REMAINING"],["02 NOV","BIRTHDAY"],["TRACK","FAN ACTIVATION"]],p:"Dedicated birthday intelligence window. Current architecture is prepared for fan volume, velocity, geography and sentiment records."},
"KING BUZZ":{k:"24 DECEMBER 2026",t:"KING BUZZ",s:[["80","DAYS REMAINING"],["742.4K","KING POSTS · 05 OCT"],["38.72M","VIDEO VIEWS · 05 OCT"],["+6.2%","POST CHANGE"],["+24.2%","VIDEO CHANGE"],["+25.0%","TOP VIDEO CHANGE"]],p:"Observed daily series: 699,000 KING posts on 04 Oct → 742,400 on 05 Oct; video views 31.18M → 38.72M; top video 12.97M → 16.21M."},
"LIVE ATTENTION":{k:"OBSERVED · 05 OCT 2026",t:"LIVE ATTENTION",s:[["742.4K","KING POSTS"],["38.72M","VIDEO VIEWS"],["16.21M","TOP VIDEO"],["+6.2%","POST VELOCITY"]],p:"The master graphic's attention panel is now backed by the daily KING intelligence record. A production live-feed can replace the daily snapshot without changing the visual layer."},
"SENTIMENT ANALYSIS":{k:"DATASET STATUS",t:"SENTIMENT ANALYSIS",s:[["—","POSITIVE"],["—","NEUTRAL"],["—","NEGATIVE"],["—","SAMPLE SIZE"]],p:"The displayed 68/23/9 graphic is visual reference material, not treated as measured data. Production sentiment requires a defined corpus, classifier, sample size and window."},
"TOP CONVERSATION THEMES":{k:"TOPIC INTELLIGENCE",t:"TOP CONVERSATION THEMES",s:[["—","KING / FILM"],["—","SRK LOOK"],["—","TRAILER"],["—","RELEASE"],["—","MUSIC"],["—","FAN EMOTION"]],p:"The visual preserves the reference hierarchy. Percentages are only populated when a measured conversation corpus and denominator are connected."},
"DOOM / RDJ":{k:"LONGITUDINAL BENCHMARK",t:"KING vs RDJ / DOOM",s:[["742.4K","KING · 05 OCT"],["699K","KING · 04 OCT"],["+6.2%","KING VELOCITY"],["31,842","USERS ANALYSED"],["48,327","POSTS / COMMENTS"],["52,134","CLASSIFIED ITEMS"]],p:"Daily intelligence sample: 1,284 articles, 416 videos, 2,107 images, estimated reach 4.7M, 27 geographies, 8 platforms, 00:00–23:59 IST. RDJ comparison fields remain unmeasured where marked X."},
"THE MYTH":{k:"01 · HISTORICAL EVOLUTION",t:"THE MYTH",s:[["1992","THE FACE"],["1990s","THE ICON"],["2000s","GLOBAL INDIAN"],["2008–13","DIGITAL MYTH"],["2018","ZERO"],["2026","KING"]],p:"The historical spine: face → icon → global cultural symbol → digital myth → shell → ZERO → silence → resurrection → KING."},
"GLOBAL PRESENCE":{k:"GLOBAL OBSERVATORY",t:"GLOBAL PRESENCE",s:[["12.4M","7-DAY TOTAL IN REFERENCE"],["50","COUNTRIES IN REFERENCE"],["—","LIVE SOURCE"],["—","COUNTRY DENOMINATOR"]],p:"The world map is part of the visual master. Live geographic counts must be connected to a defined source corpus before the reference figures are treated as observed."},
"CITY ACTIVITY":{k:"7-DAY GLOBAL WINDOW",t:"CITY ACTIVITY",s:[["100","MUMBAI"],["78","DELHI"],["65","JAKARTA"],["62","BENGALURU"],["58","DUBAI"],["52","LONDON"],["48","RIYADH"],["44","KARACHI"],["42","NEW YORK"],["39","TORONTO"]],p:"These are the city values shown in the supplied master graphic. They remain presentation values until the underlying city dataset is connected."},
"CONVERSATION CLOUD":{k:"LIVE VOCABULARY",t:"REAL-TIME CONVERSATION CLOUD",s:[["KING","CORE TERM"],["Trailer","TOPIC"],["SRK","STAR"],["Jawan","COMPARISON"],["Pathaan","COMPARISON"],["AskSRK","INTERACTION"]],p:"The cloud is the visual vocabulary layer. A live corpus can update term size and velocity without altering the page composition."},
"MODULES":{k:"13 MODULES",t:"KING INTELLIGENCE SYSTEM",s:[["01","THE MYTH"],["02","THE STAR"],["03","SCREEN"],["04","BRAND"],["05","EVENTS"],["06","WORLD"],["07","AUDIENCE"],["08","THE FAN"],["09","MACHINE"],["10","CONVERSATION"],["11","NETWORK"],["12","DOOM"],["13","ARCHIVE"]],p:"Each visual card is an interactive entry point into the larger research architecture."},
"HISTORICAL TIMELINE":{k:"1992 → 2026",t:"HISTORICAL TIMELINE",s:[["1992","THE FACE"],["1990s","THE ICON"],["2000s","THE GLOBAL INDIAN"],["2008–2013","THE DIGITAL MYTH"],["2014–2018","THE SHELL"],["2018","ZERO"],["2019–2022","THE SILENCE"],["2023–2025","THE RESURRECTION"],["2026","KING"]],p:"The timeline is the historical spine of THE MYTH OF SRK."},
"METHODOLOGY":{k:"DATA INTEGRITY",t:"METHODOLOGY / SOURCES",s:[["OBSERVED","DIRECT"],["INDEXED","CATALOGUED"],["MODELLED","DERIVED"],["ILLUSTRATIVE","REFERENCE"],["—","UNKNOWN"],["REQUIRED","DATASET NEEDED"]],p:"The website separates the supplied graphic from measured intelligence. The master graphic is the visual layer; evidence and datasets determine which figures can be asserted as factual."}
};
function openD(k){const d=D[k]||D.METHODOLOGY;let h='<div class="ey">'+d.k+'</div><h1>'+d.t+'</h1><div class="grid">';for(const x of d.s)h+='<div class="stat"><b>'+x[0]+'</b><span>'+x[1]+'</span></div>';h+='</div><p>'+d.p+'</p>';document.getElementById('body').innerHTML=h;document.getElementById('drawer').classList.add('open')}
function closeD(){document.getElementById('drawer').classList.remove('open')}
document.querySelectorAll('.hot').forEach(x=>x.onclick=()=>openD(x.dataset.k));
document.getElementById('drawer').onclick=e=>{if(e.target.id==='drawer')closeD()};
</script></body></html>
