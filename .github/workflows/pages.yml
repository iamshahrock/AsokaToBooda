name: Deploy static site to GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build intended public site
        shell: bash
        run: |
          set -euo pipefail
          rm -rf site
          mkdir -p site

          cp agarmainkinghota.html site/index.html
          cp agarmainkinghota.html site/
          cp master-home.html site/
          cp -R asoka-to-booda site/
          cp -R fan-made-ai-universe site/
          cp -R fan-billboard site/
          cp CHESS81.HTML site/
          cp -R game site/
          cp -R assets site/
          cp -R preview site/
          cp -R v2 site/
          cp -R create play crown know lairs about contact faq site/

          for dir in             "Bauua Raw Material"             "data"             "king-intelligence-shared"             "king-intelligence"             "king-intelligence-2"             "king-intelligence-3"             "king-intelligence-4"             "king-intelligence-5"             "king-intelligence-6"             "king-intelligence-7"             "king-intelligence-8"             "king-intelligence-9"             "king-intelligence-10"             "king-intelligence-11"             "king-intelligence-12"             "king-intelligence-13"             "king-intelligence-14"             "king-intelligence-15"             "king-intelligence-16"             "king-intelligence-17"             "king-intelligence-18"
          do
            test -d "$dir"
            cp -R "$dir" site/
          done

          rm -f site/king-intelligence/index.backup-20261006.html

          # Cache-bust the shared styles and scripts so phones and tablets never pair a new page with an old cached file.
          V="${GITHUB_SHA:0:8}"
          find site \( -name '*.html' -o -name '*.HTML' \) | while read -r f; do
            sed -i -E "s#(assets/(site\.css|v2\.css|header\.js|footer\.js|starks\.js|chess81-engine\.js))([\"'])#\1?v=${V}\3#g" "$f"
          done
          grep -q "v2.css?v=${V}" site/index.html
          touch site/.nojekyll
          test -f site/index.html
          test -f site/CHESS81.HTML
          test -f site/fan-made-ai-universe/index.html
          test -f site/fan-billboard/index.html
          test -f site/v2/index.html
          test -f site/v2/create/index.html
          test -f site/create/index.html
          test -f site/lairs/index.html

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
