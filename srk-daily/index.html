<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>SRK DAILY — Agar Main King Hota</title>
<meta name="description" content="SRK DAILY: the news about Shah Rukh Khan and KING, every day, with real numbers. Summary analytics, the birthday scorecard and more.">
<meta name="theme-color" content="#0a0707">
<link rel="canonical" href="https://agarmainkinghota.com/srk-daily/">
<meta property="og:title" content="SRK DAILY · the news about the King, every day">
<meta property="og:description" content="Real numbers, read by hand, every day until KING on 24 December 2026.">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/assets/icons/crown-32.png">
<link rel="apple-touch-icon" href="/assets/icons/apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700&family=Cormorant+Garamond:ital,wght@0,500;0,600;0,700;1,500;1,600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../assets/site.css">
<link rel="stylesheet" href="../assets/v2.css">
<style>
:root{--gold:#f0c24e;--gold-d:#c9a24a}
.nd-mast{text-align:center;border-bottom:3px double #5a3a30;padding:18px 0 12px;margin:0 0 18px}
.nd-mast .top{display:flex;justify-content:space-between;flex-wrap:wrap;gap:6px;font:700 11px Archivo,sans-serif;letter-spacing:.14em;color:#a89a90;text-transform:uppercase;border-bottom:1px solid #3a2626;padding-bottom:8px}
.nd-mast h1{font-family:var(--display);font-weight:400;font-size:clamp(48px,10vw,104px);line-height:.95;margin:10px 0 2px;color:#f4ece4;letter-spacing:.02em}
.nd-mast h1 span{color:#e0312b}
.nd-mast p{font:italic 600 clamp(16px,2.4vw,20px) 'Cormorant Garamond',serif;color:var(--gold);margin:0}
.nd-idx{display:flex;gap:8px;overflow-x:auto;margin:0 0 22px;padding-bottom:4px}
.nd-idx a{flex:none;max-width:260px;border:1px solid #3a2626;background:#120b0b;padding:8px 10px;text-decoration:none;color:#e6dcd4}
.nd-idx a:hover,.nd-idx a.on{border-color:var(--gold)}
.nd-idx small{display:block;font:700 10px Archivo,sans-serif;letter-spacing:.12em;color:#e0312b;text-transform:uppercase}
.nd-idx b{display:block;font:600 13px/1.3 Archivo,sans-serif}
.nd-post{max-width:780px;margin:0 auto 56px;border-bottom:1px solid #3a2626;padding-bottom:36px;scroll-margin-top:120px}
.nd-k{font:700 12px Archivo,sans-serif;letter-spacing:.16em;text-transform:uppercase;color:#e0312b;margin:0 0 6px}
.nd-post h2{font-family:var(--display);font-weight:400;font-size:clamp(30px,5vw,50px);line-height:1.02;margin:0 0 10px;color:#f4ece4;text-transform:uppercase}
.nd-post h2 a{color:inherit;text-decoration:none}
.nd-deck{font:italic 500 clamp(19px,2.6vw,23px)/1.35 'Cormorant Garamond',serif;color:#e6dcd4;margin:0 0 10px}
.nd-by{font:600 12px Archivo,sans-serif;color:#a89a90;margin:0 0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.nd-by button{background:none;border:1px solid #5a3a30;color:var(--gold);font:600 12px Archivo,sans-serif;padding:4px 10px;cursor:pointer}
.nd-fig{margin:0 0 16px}.nd-fig img{width:100%;aspect-ratio:16/9;object-fit:cover;border:1px solid #3a2626;display:block}
.nd-fig figcaption{font-size:12px;color:#8f8278;margin-top:4px}
.nd-post h3{font:700 14px Archivo,sans-serif;letter-spacing:.14em;text-transform:uppercase;color:var(--gold);margin:22px 0 8px}
.nd-post p.t{font-size:17px;line-height:1.65;color:#e6dcd4;margin:0 0 12px}
.nd-st{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:8px;margin:0 0 14px}
.nd-st div{border:1px solid #3a2626;background:#120b0b;padding:10px}
.nd-st small{display:block;font:700 10px Archivo,sans-serif;letter-spacing:.1em;color:#a89a90;text-transform:uppercase}
.nd-st b{display:block;font-family:var(--display);font-weight:400;font-size:28px;color:#f4ece4;line-height:1.1;margin:3px 0 2px}
.nd-st i{font-style:normal;font-size:12px;color:#bfb3a9}
.nd-tl{margin:0 0 14px;border-left:2px solid #e0312b;padding-left:14px}
.nd-tl p{font-size:17px;line-height:1.6;color:#e6dcd4;margin:0 0 10px}
.nd-tl b{font:700 14px Archivo,sans-serif;color:#e0312b;margin-right:8px}
.nd-q{font:italic 600 clamp(26px,4vw,36px) 'Cormorant Garamond',serif;color:var(--gold);text-align:center;margin:18px 0}
.nd-ln{list-style:none;padding:0;margin:0 0 14px}
.nd-ln li{margin:0 0 6px}.nd-ln a{color:var(--gold);font:600 15px Archivo,sans-serif}
.nd-tags{font:600 13px Archivo,sans-serif;color:#a89a90}
.nd-all{display:block;text-align:center;font:600 14px Archivo,sans-serif;color:var(--gold);margin:0 0 30px}
</style>
</head>
<body class="v2">
<script src="../assets/header.js"></script>
<main class="wrap">
<header class="nd-mast">
  <div class="top"><span id="ndDate"></span><span>Agar Main King Hota</span><span id="ndDays"></span></div>
  <h1>SRK <span>DAILY</span></h1>
  <p>The news about the King, every day. Real numbers, read by hand.</p>
</header>
<nav class="nd-idx" id="ndIdx" aria-label="Posts"></nav>
<div id="ndFeed"></div>
</main>
<script>
(function(){
  var $=function(s){return document.querySelector(s);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  var IST=new Date(Date.now()+(330+new Date().getTimezoneOffset())*6e4);
  $('#ndDate').textContent=IST.toLocaleDateString('en-GB',{weekday:'long',day:'numeric',month:'long',year:'numeric'});
  var dk=Math.ceil((Date.parse('2026-12-24T00:00:00+05:30')-Date.now())/864e5);$('#ndDays').textContent=dk>0?dk+' days to KING':'KING is out';
  function fmt(d){return new Date(d+'T12:00:00+05:30').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
  function block(b){
    if(b.h)return '<h3>'+esc(b.h)+'</h3>';
    if(b.p)return '<p class="t">'+esc(b.p)+'</p>';
    if(b.stats)return '<div class="nd-st">'+b.stats.map(function(s){return '<div><small>'+esc(s[0])+'</small><b>'+esc(s[1])+'</b>'+(s[2]?'<i>'+esc(s[2])+'</i>':'')+'</div>';}).join('')+'</div>';
    if(b.time)return '<div class="nd-tl">'+b.time.map(function(t){return '<p><b>'+esc(t[0])+'</b>'+esc(t[1])+'</p>';}).join('')+'</div>';
    if(b.quote)return '<p class="nd-q">'+esc(b.quote.q)+'</p>';
    if(b.links)return '<ul class="nd-ln">'+b.links.map(function(l){return '<li><a href="'+esc(l[1])+'">'+esc(l[0])+' →</a></li>';}).join('')+'</ul>';
    if(b.list)return '<ul>'+b.list.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
    return '';
  }
  function post(x){
    return '<article class="nd-post" id="'+esc(x.id)+'"><p class="nd-k">'+esc(x.kicker)+'</p><h2><a href="?p='+esc(x.id)+'">'+esc(x.title)+'</a></h2>'+
      (x.deck?'<p class="nd-deck">'+esc(x.deck)+'</p>':'')+
      '<p class="nd-by"><span>'+fmt(x.date)+(x.time?' · '+esc(x.time):'')+'</span><button data-sh="'+esc(x.id)+'">Share</button></p>'+
      (x.img?'<figure class="nd-fig"><img src="'+esc(x.img)+'" alt="'+esc(x.img_alt||'')+'" loading="lazy" referrerpolicy="no-referrer"><figcaption>'+esc(x.img_credit||'')+'</figcaption></figure>':'')+
      x.blocks.map(block).join('')+(x.tags?'<p class="nd-tags">'+x.tags.map(esc).join(' ')+'</p>':'')+'</article>';
  }
  var P=[];
  document.addEventListener('click',function(e){var b=e.target.closest('[data-sh]');if(!b)return;
    var x=P.filter(function(p){return p.id===b.dataset.sh;})[0],u=location.origin+'/srk-daily/?p='+x.id;
    if(navigator.share)navigator.share({title:x.title,text:x.title,url:u}).catch(function(){});
    else window.open('https://wa.me/?text='+encodeURIComponent(x.title+' '+u),'_blank');});
  fetch('../data/srk-daily.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    P=d.posts.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:0;});
    var one=new URLSearchParams(location.search).get('p'),show=one?P.filter(function(x){return x.id===one;}):P;
    if(!show.length)show=P;
    $('#ndIdx').innerHTML=P.map(function(x){return '<a href="?p='+esc(x.id)+'" class="'+(x.id===one?'on':'')+'"><small>'+fmt(x.date)+'</small><b>'+esc(x.title)+'</b></a>';}).join('');
    $('#ndFeed').innerHTML=show.map(post).join('')+(one?'<a class="nd-all" href="./">All posts →</a>':'');
    if(one)document.title=show[0].title+' — SRK DAILY';
  });
})();
</script>
<script src="../assets/footer.js" defer></script>
</body>
</html>
