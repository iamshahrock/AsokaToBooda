<style>
/* The Third Eye (SRKWorld, 2000), as a newspaper page on paper; masthead in a plain bold serif (owner: blackletter was hard to read) */
.np{--paper:#fbf8f1;--ink:#1d1a17;--blue:#22409a;--red:#c8102e;--maroon:#8a1c2b;--rule:#c9bfae;--muted:#6b6258;
  background:var(--paper);color:var(--ink);max-width:1180px;margin:10px auto 40px;padding:14px clamp(10px,2vw,22px) 24px;box-shadow:0 0 0 1px #3a2626,0 18px 50px rgba(0,0,0,.5);font-family:'Libre Baskerville',Georgia,'Times New Roman',serif}
.np a{color:inherit}
.np-head{display:grid;grid-template-columns:110px 1fr 150px;align-items:center;gap:12px;border-bottom:2px solid var(--rule);padding-bottom:8px}
.np-head>a img{width:96px;height:96px;object-fit:contain}
.np-head h1 img.mh{display:block;width:100%;max-width:560px;height:auto;margin:0 auto}
.np-head h1{font-family:'Playfair Display',Georgia,serif;font-weight:900;font-size:clamp(42px,8vw,96px);line-height:1;margin:0;text-align:center;color:var(--ink);letter-spacing:.02em;text-transform:uppercase}
.np-btn{display:inline-block;border:2px solid var(--red);color:var(--red);font:700 12px Archivo,sans-serif;letter-spacing:.1em;padding:6px 10px;text-decoration:none;text-transform:uppercase;text-align:center;background:#fff}
.np-btn.f{background:var(--red);color:#fff}
.np-head .np-btn{justify-self:end}
.np-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;padding:8px 2px;border-bottom:3px double var(--red);margin-bottom:14px;font:700 15px 'Libre Baskerville',serif}
.np-bar .site{font:600 13px Archivo,sans-serif;letter-spacing:.1em}
button.np-btn{cursor:pointer}
/* KING BUZZ of the day (owner, 4 Nov 2026): one chart, the previous day's summary, a button to the full daily report */
.kb{border:2px solid var(--blue);background:#fff;margin:0 0 14px}
.kb>h2{margin:0;background:var(--blue);color:#fff;font:700 15px Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:7px 12px;display:flex;justify-content:space-between;gap:8px;flex-wrap:wrap}
.kb>h2 span{font-weight:600;letter-spacing:.04em;text-transform:none}
.kb .kin{display:grid;grid-template-columns:1.2fr 1fr;gap:18px;padding:14px}
@media (max-width:760px){.kb .kin{grid-template-columns:1fr}}
.kb h4{margin:0 0 8px;font:700 11px Archivo,sans-serif;letter-spacing:.12em;text-transform:uppercase;color:var(--muted)}
.kb .row{margin:0 0 11px;font:12.5px Archivo,sans-serif}
.kb .row .lb{display:flex;justify-content:space-between;gap:8px;margin:0 0 3px}

.kb .row small{display:block;font:12px Archivo,sans-serif;color:var(--muted);margin-top:3px}

@media (max-width:640px){.np-head{grid-template-columns:64px 1fr}.np-head>a img{width:60px;height:60px}.np-head .np-btn{grid-column:1/-1;justify-self:center}.np-bar{justify-content:center;text-align:center}}

/* framed */
.fr{display:block;text-decoration:none}

.cd span{font:600 12px Archivo,sans-serif;letter-spacing:.1em;text-transform:uppercase}
.sb input{width:100%;box-sizing:border-box;border:1px solid #9b8f7c;background:#fff;font:14px Archivo,sans-serif;padding:7px;margin:0 0 6px;color:var(--ink)}

.fv img{width:100%;aspect-ratio:1/1;object-fit:cover;display:block;border:1px solid var(--rule);margin:0 0 8px}
.fv h3{margin:0 0 4px;font:700 17px/1.2 'Libre Baskerville',serif;color:var(--maroon)}
.fv p{font-size:12.5px;line-height:1.45;margin:0 0 8px}
.fv audio{width:100%;height:36px;display:block;margin:0 0 6px}
.fv small{display:block;font:12px Archivo,sans-serif;color:var(--muted)}
.fv small a{color:var(--blue)}
.hl{display:grid;grid-template-columns:150px 1fr;gap:14px;padding:12px;text-decoration:none}
@media (max-width:520px){.hl{grid-template-columns:96px 1fr}}
.hl img{width:100%;aspect-ratio:3/4;object-fit:cover;border:1px solid #b9ad99}
.hl h3{margin:0 0 6px;font:700 21px/1.2 'Libre Baskerville',serif;color:var(--ink)}
.hl p{margin:0 0 10px;font-size:14px;line-height:1.55}
.hl span,.ku .go2{display:inline-block;background:var(--red);color:#fff;font:700 12px Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:8px 12px;text-decoration:none}
.ku{padding:12px}
.ku .lk{font:700 11px Archivo,sans-serif;letter-spacing:.12em;color:var(--red);text-transform:uppercase;margin:0 0 4px}

.ix a small{display:block;font:700 10px Archivo,sans-serif;letter-spacing:.1em;color:var(--red);text-transform:uppercase}

/* article view */
.ar{max-width:760px;margin:0 auto}
.ar .k{font:700 12px Archivo,sans-serif;letter-spacing:.14em;color:var(--red);text-transform:uppercase;margin:0 0 6px}
.ar h2{font:700 clamp(28px,4.4vw,44px)/1.12 'Libre Baskerville',serif;margin:0 0 10px;color:var(--ink)}
.ar .dk{font:italic 19px/1.45 'Libre Baskerville',serif;color:#3d3630;margin:0 0 10px}
.ar .by{font:600 12px Archivo,sans-serif;color:var(--muted);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:6px 0;margin:0 0 14px;display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.ar .by button{background:none;border:1px solid var(--red);color:var(--red);font:600 12px Archivo,sans-serif;padding:3px 10px;cursor:pointer}
.ar figure{margin:0 0 14px}.ar figure img{width:100%;display:block;filter:sepia(.15);border:1px solid var(--rule)}
.ar figcaption{font:italic 12px 'Libre Baskerville',serif;color:var(--muted);margin-top:4px}

.ar p.t{font-size:16.5px;line-height:1.75;margin:0 0 12px}
.ar .body>p.t:first-of-type::first-letter{float:left;font:900 60px/.85 'Playfair Display',Georgia,serif;color:var(--red);margin:4px 8px 0 0}
.ar ul{font-size:15.5px;line-height:1.65;margin:0 0 12px;padding-left:22px}
.st{display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:8px;margin:0 0 14px}
.st div{border:1px solid var(--rule);background:#fff;padding:9px}
.st small{display:block;font:700 10px Archivo,sans-serif;letter-spacing:.1em;color:var(--muted);text-transform:uppercase}
.st b{display:block;font:700 22px 'Libre Baskerville',serif;color:var(--ink);margin:3px 0 2px}
.st i{font:12px Archivo,sans-serif;color:var(--muted);font-style:normal}
.tl{border-left:3px solid var(--red);padding-left:14px;margin:0 0 14px}
.tl p{font-size:16px;line-height:1.65;margin:0 0 10px}
.tl b{font:700 14px Archivo,sans-serif;color:var(--red);margin-right:8px}
.q{font:italic 700 clamp(24px,3.6vw,32px) 'Libre Baskerville',serif;text-align:center;color:var(--maroon);margin:18px 0}
.ln{list-style:none;padding:0 !important}.ln a{color:var(--blue);font:600 15px Archivo,sans-serif}
.tags{font:600 13px Archivo,sans-serif;color:var(--muted)}
.back{display:inline-block;margin:0 0 14px;background:var(--blue);color:#fff !important;font:700 12px Archivo,sans-serif;letter-spacing:.08em;text-transform:uppercase;padding:8px 14px;text-decoration:none}
.back:hover{background:var(--red)}
.back.end{margin:18px 0 0}
.mo{border-top:3px double var(--red);margin:26px 0 0;padding-top:4px}
.mo h3{background:var(--red)!important}
.mo a{display:block;padding:12px 0;border-bottom:1px dotted var(--rule);text-decoration:none}
.mo small{display:block;font:700 10px Archivo,sans-serif;letter-spacing:.1em;color:var(--red);text-transform:uppercase}
.mo b{display:block;font:700 20px/1.3 'Libre Baskerville',serif;color:var(--ink);margin:2px 0 4px}
.mo span{font-size:14px;line-height:1.5;color:var(--muted)}
.mo a:hover b{color:var(--maroon)}
/* print / PDF edition (owner, 4 Nov 2026: 'a short intro daily with the PDF version and a link to our daily site') */
.pr-only{display:none}
html.snap #site-header,html.snap #site-footer,html.snap .sh-top{display:none!important}html.snap body{background:#fbf8f1}html.snap main.wrap{padding:0!important;max-width:none!important}html.snap .np{margin:0;max-width:none;box-shadow:none;min-height:100vh}
@media print{
  @page{size:A4;margin:0}
  html,body{background:#fbf8f1!important}
  *{-webkit-print-color-adjust:exact;print-color-adjust:exact}
  #site-footer,.sh-top,.back,.np-head .np-btn,.np-bar button,.ar .by button,.kb,.mo,.tags{display:none!important}
  main.wrap{padding:0!important;max-width:none!important}
  .np{box-shadow:none;margin:0;max-width:none;padding:12mm 14mm;min-height:100vh}
  .np-head{grid-template-columns:90px 1fr}
  .ar{max-width:none}
  .ar h2{font-size:34px}

  .pr-only{display:block}
  .pr-end{margin:18px 0 0;padding:12px 14px;border:2px solid var(--red);font:700 13px Archivo,sans-serif;letter-spacing:.06em;text-align:center;break-inside:avoid}
  .pr-end b{display:block;color:var(--red);font-size:16px;margin-bottom:4px}
  /* front page edition: the whole paper, three columns, KING BUZZ open, no form controls */
  html.pdf-front .kb{display:block!important}
  html.pdf-front .np-grid{grid-template-columns:250px 1fr 300px!important}
  html.pdf-front .np-l{order:0!important}html.pdf-front .np-c{grid-column:auto!important;order:0!important}html.pdf-front .np-r{order:0!important}
  html.pdf-front .pl button,html.pdf-front .sb input,html.pdf-front .sb button,html.pdf-front .fv audio,html.pdf-front #sbMsg,html.pdf-front #plMsg{display:none!important}

}

<script>
(function(){
  var API='https://asokatobooda.iamshahrock.workers.dev';
  var $=function(s){return document.querySelector(s);};
  function esc(s){return String(s==null?'':s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];});}
  $('#npDate').textContent=new Date(Date.now()+(330+new Date().getTimezoneOffset())*6e4).toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'}).replace(/ (\d{4})$/,', $1');
  var DK=Math.max(0,Math.ceil((Date.parse('2026-12-24T00:00:00+05:30')-Date.now())/864e5));
  function fmt(d){return new Date(d+'T12:00:00+05:30').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});}
  function block(b){
    if(b.h)return '<h3>'+esc(b.h)+'</h3>';
    if(b.p)return '<p class="t">'+esc(b.p)+'</p>';
    if(b.stats)return '<div class="st">'+b.stats.map(function(s){return '<div><small>'+esc(s[0])+'</small><b>'+esc(s[1])+'</b>'+(s[2]?'<i>'+esc(s[2])+'</i>':'')+'</div>';}).join('')+'</div>';
    if(b.time)return '<div class="tl">'+b.time.map(function(t){return '<p><b>'+esc(t[0])+'</b>'+esc(t[1])+'</p>';}).join('')+'</div>';
    if(b.quote)return '<p class="q">'+esc(b.quote.q)+'</p>';
    if(b.links)return '<ul class="ln">'+b.links.map(function(l){return '<li><a href="'+esc(l[1])+'">'+esc(l[0])+' →</a></li>';}).join('')+'</ul>';
    if(b.list)return '<ul>'+b.list.map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>';
    return '';
  }
  function firstP(x){for(var i=0;i<x.blocks.length;i++)if(x.blocks[i].p)return x.blocks[i].p;return '';}
  function short(t,n){t=String(t||'');return t.length>n?t.slice(0,t.lastIndexOf(' ',n))+'…':t;}
  function beat(D){return '<section class="bx"><h2>The Beat</h2>'+D.beat.map(function(b){return '<a class="bt" href="'+esc(b.url)+'"><img src="'+esc(b.img)+'" alt="" loading="lazy" referrerpolicy="no-referrer"><div><h3>'+esc(b.t)+'</h3><p>'+esc(b.d)+'</p><span>More</span></div></a>';}).join('')+'</section>';}

  function sideL(D){
    var p=D.poll;
    return '<section class="bx"><h2>Poll Station</h2><div class="in"><form class="pl" id="poll"><small>This week\'s question</small><p>'+esc(p.q)+'</p>'+
      p.o.map(function(o,i){return '<label><input type="radio" name="po" value="'+i+'"> '+esc(o)+'</label>';}).join('')+
      '<button type="submit">Submit</button><span class="pr-only pr-vote">Vote at agarmainkinghota.com/srk-daily</span><div class="res" id="plRes"></div><p class="msg" id="plMsg"></p></form></div></section>'+
      (D.fanverse?'<section class="bx r fv"><h2>FANVERSE</h2><div class="in"><small style="color:var(--red);font-weight:700;letter-spacing:.1em;text-transform:uppercase;margin:0 0 6px">'+esc(D.fanverse.kicker)+'</small><a href="'+esc(D.fanverse.url)+'"><img src="'+esc(D.fanverse.img)+'" alt="INQUILAAB KING KE SAATH" loading="lazy"></a><h3>'+esc(D.fanverse.title)+'</h3><p>'+esc(D.fanverse.line)+'</p>'+
        '<audio controls controlsList="nodownload noplaybackrate" preload="metadata" src="'+esc(D.fanverse.audio)+'"></audio><span class="pr-only pr-vote">Listen at agarmainkinghota.com/inquilab</span><small><a href="'+esc(D.fanverse.credit_url)+'" target="_blank" rel="noopener">'+esc(D.fanverse.credit)+'</a> · <a href="'+esc(D.fanverse.url)+'">The anthem →</a></small></div></section>':'')+
      '<section class="bx r"><h2>Countdown</h2><div class="in cd"><b>'+DK+'</b><span>days to KING · 24 Dec 2026</span></div></section>'+
      '<section class="bx r" id="sub"><h2>Subscribe</h2><form class="in sb" id="sbF" novalidate><p>The day\'s King news and numbers in your inbox. One email a day at most; we never share your address.</p>'+
      '<input id="sbName" maxlength="60" placeholder="Your name (optional)" autocomplete="name"><input id="sbMail" type="email" maxlength="120" placeholder="Your email" autocomplete="email"><button type="submit">Subscribe to SRK DAILY</button><span class="pr-only pr-vote">Subscribe at agarmainkinghota.com/srk-daily</span><p class="msg" id="sbMsg"></p></form></section>';
  }
  function front(D,P){
    var lead=P[0],rest=P.slice(1);
    var c='<section class="bx"><h2>Framed</h2><a class="fr" href="?p='+esc(lead.id)+'"><div class="ph"><img src="'+esc(lead.img||'')+'" alt="'+esc(lead.img_alt||'')+'" referrerpolicy="no-referrer"></div>'+
      '<p class="cap"><b>'+esc(lead.title)+'.</b> '+esc(lead.deck||'')+'</p></a><a class="more" href="?p='+esc(lead.id)+'">Read the story…</a></section>';
    var boxes=[{t:'The Big Picture',x:rest[0]},{t:'SpeakEasy',x:rest[1]}].filter(function(b){return b.x;});
    c+='<div class="duo'+(boxes.length<2?' one':'')+'">'+boxes.map(function(b){return '<section class="bx r"><h2>'+b.t+'</h2><div class="in"><a class="t" href="?p='+esc(b.x.id)+'">'+esc(b.x.title)+'</a><p>'+esc(short(b.x.deck||firstP(b.x),170))+'</p></div><a class="more" href="?p='+esc(b.x.id)+'">More</a></section>';}).join('')+'</div>';
    c+='<div id="hlBox"></div><div id="kuBox"></div>';
    var r=beat(D)+'<section class="bx r"><h2>All the stories</h2><div class="in ix">'+P.map(function(x){return '<a href="?p='+esc(x.id)+'"><small>'+fmt(x.date)+'</small>'+esc(x.title)+'</a>';}).join('')+'</div></section>';
    return '<div class="np-grid"><div class="np-l">'+sideL(D)+'</div><div class="np-c">'+c+'</div><div class="np-r">'+r+'</div></div>';
  }
  function article(D,x){
    var more=P.filter(function(p){return p.id!==x.id;});
    return '<article class="ar"><a class="back" href="./">← SRK DAILY front page</a><p class="k">'+esc(x.kicker)+'</p><h2>'+esc(x.title)+'</h2>'+(x.deck?'<p class="dk">'+esc(x.deck)+'</p>':'')+
      '<p class="by"><span>'+fmt(x.date)+(x.time?' · '+esc(x.time):'')+' · SRK DAILY</span><button data-sh="'+esc(x.id)+'">Share</button></p>'+
      (x.img?'<figure><img src="'+esc(x.img)+'" alt="'+esc(x.img_alt||'')+'" referrerpolicy="no-referrer"><figcaption>'+esc(x.img_credit||'')+'</figcaption></figure>':'')+
      '<div class="body">'+x.blocks.map(block).join('')+'</div>'+(x.tags?'<p class="tags">'+x.tags.map(esc).join(' ')+'</p>':'')+
      (more.length?'<section class="mo"><h3>More from SRK DAILY</h3>'+more.map(function(m){return '<a href="?p='+esc(m.id)+'"><small>'+fmt(m.date)+'</small><b>'+esc(m.title)+'</b><span>'+esc(short(m.deck||firstP(m),160))+'</span></a>';}).join('')+'</section>':'')+
      '<a class="back end" href="./">← Back to the SRK DAILY front page</a>'+
      '<div class="pr-only pr-end"><b>SRK DAILY · every day at AGARMAINKINGHOTA.COM/SRK-DAILY</b>Read the full edition, vote in the Poll Station, see KING BUZZ of the day and subscribe.</div></article>';
  }

  // KING BUZZ of the day: the ledger record of the previous IST day (or the latest one before it)
  var KBN={king_title_reveal_views:'KING · Title Reveal',king_date_announcement_views:'KING · Date Announcement',king_tu_mil_jaaye_views:'Tu Mil Jaaye',doomsday_official_trailer_views:'Avengers: Doomsday · trailer'};
  var kbDone=false;
  function kbLoad(){
    if(kbDone)return;kbDone=true;var box=$('#kb');box.innerHTML='<div class="kin"><p>Loading the KING Buzz ledger…</p></div>';
    fetch('../data/king-intelligence-daily.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(L){
      var R=L.records||[],today=new Date(Date.now()+(330+new Date().getTimezoneOffset())*6e4).toISOString().slice(0,10);
      var before=R.filter(function(r){return r.date<today;}),rec=before.length?before[before.length-1]:R[R.length-1];
      var prev=R.filter(function(r){return r.date<rec.date;});
      function val(r,id){var m=(r.metrics||[]).filter(function(x){return x.series_id===id;})[0];return m&&m.value!=null?m.value:null;}
      function last(id){for(var i=prev.length-1;i>=0;i--){var v=val(prev[i],id);if(v!=null)return {v:v,d:prev[i].date};}return null;}
      var rows=Object.keys(KBN).map(function(id){return {id:id,n:KBN[id],v:val(rec,id),p:last(id)};}).filter(function(r){return r.v!=null;});
      var max=Math.max.apply(null,rows.map(function(r){return r.v;}).concat([1]));
      var nf=function(n){return Number(n).toLocaleString('en-US');};
      var d=new Date(rec.date+'T12:00:00+05:30').toLocaleDateString('en-GB',{day:'numeric',month:'long',year:'numeric'});
      var chart=rows.map(function(r){var ch=r.p?r.v-r.p.v:null;
        return '<div class="row"><div class="lb"><b>'+esc(r.n)+'</b><strong>'+nf(r.v)+'</strong></div><div class="tr"><i class="'+(r.id.indexOf('doomsday')===0?'d':'')+'" style="width:'+(r.v/max*100).toFixed(1)+'%"></i></div>'+
          (ch!=null?'<small>'+(ch>=0?'+':'')+nf(ch)+' since '+new Date(r.p.d+'T12:00:00+05:30').toLocaleDateString('en-GB',{day:'numeric',month:'short'})+'</small>':'<small>first reading</small>')+'</div>';}).join('');
      box.innerHTML='<h2>KING BUZZ of the day <span>'+esc(d)+'</span></h2><div class="kin"><div><h4>YouTube views at the day\'s reading</h4>'+(chart||'<p>N/A: no YouTube reading that day.</p>')+'</div>'+
        '<div><h4>The day in short</h4><ul>'+(rec.topics||[]).slice(0,3).map(function(t){return '<li>'+esc(t)+'</li>';}).join('')+'</ul>'+
        '<a class="go" href="/king-intelligence/daily.html?date='+esc(rec.date)+'">Click for full details →</a><p class="src">From the KING Buzz daily ledger, record '+esc(rec.record_id||rec.date)+'. Real readings or N/A.</p></div></div>';
    }).catch(function(){box.innerHTML='<div class="kin"><p>Could not load KING Buzz. <a class="go" href="/king-intelligence/daily.html">Click for full details →</a></p></div>';});
  }
  $('#kbBtn').addEventListener('click',function(){var box=$('#kb'),o=box.hidden;box.hidden=!o;this.setAttribute('aria-expanded',o?'true':'false');this.textContent='KING BUZZ of the day '+(o?'▴':'▾');if(o){kbLoad();box.scrollIntoView({behavior:'smooth',block:'nearest'});}});

  // one thing from the site each IST day, and one KING University lesson each day (owner, 4 Nov 2026)
  function dayN(){var t=new Date(Date.now()+(330+new Date().getTimezoneOffset())*6e4).toISOString().slice(0,10);return Math.max(0,Math.round((Date.parse(t)-Date.parse('2026-11-04'))/864e5));}
  function daily(D){
    var n=dayN(),H=D.highlights||[];
    if(H.length){var h=H[n%H.length];$('#hlBox').innerHTML='<section class="bx r"><h2>From the site today</h2><a class="hl" href="'+esc(h.url)+'"><img src="'+esc(h.img)+'" alt="" loading="lazy"><div><h3>'+esc(h.t)+'</h3><p>'+esc(h.d)+'</p><span>'+esc(h.cta||'Open')+' →</span></div></a></section>';}
    fetch('../data/king-studies.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(K){
      var all=[];(K.levels||[]).forEach(function(L){L.lessons.forEach(function(x,i){all.push({L:L,x:x,i:i});});});
      if(!all.length)return;var u=all[(n*7)%all.length],x=u.x,L=u.L;
      var note=(x.notes&&x.notes[0])||x.line||'';
      $('#kuBox').innerHTML='<section class="bx"><h2>Today at KING University</h2><div class="ku"><p class="lk">'+esc(L.code||'')+' · '+esc(L.name)+' · '+esc(L.title)+' · Unit '+(u.i+1)+'</p><h3>Learn: '+esc(x.t)+'</h3><p class="by2">'+esc(x.by)+' · '+esc(x.film)+(x.y?' · '+x.y:'')+'</p><p>'+esc(note)+'</p>'+
        '<a class="go2" href="/king-studies/?level='+esc(L.id)+'#lesson-'+esc(L.id)+'-'+(u.i+1)+'">Study this unit at KING University →</a></div></section>';
    }).catch(function(){});
  }

  var P=[],D=null;
  function device(){try{return window.STARKS?STARKS.get().device:'';}catch(e){return '';}}
  function showRes(st){var p=D.poll,t=st.total||0;$('#plRes').innerHTML=p.o.map(function(o,i){var n=(st.counts||{})[i]||0,pc=t?Math.round(n/t*100):0;return '<div>'+esc(o)+' · '+pc+'%<i style="width:'+pc+'%"></i></div>';}).join('')+'<div>'+t.toLocaleString('en-IN')+' vote'+(t===1?'':'s')+'</div>';}
  function wire(){
    if(!$('#poll'))return;
    var pf=$('#poll'),KEY='amkh-poll-'+D.poll.id,mine=null;try{mine=localStorage.getItem(KEY);}catch(e){}
    if(mine!=null){var r=pf.querySelector('input[value="'+mine+'"]');if(r)r.checked=true;fetch(API+'/daily-poll?poll='+D.poll.id).then(function(r){return r.json();}).then(showRes).catch(function(){});}
    pf.addEventListener('submit',function(e){e.preventDefault();var c=pf.querySelector('input:checked'),m=$('#plMsg');
      if(!c){m.textContent='Choose an answer first.';return;}
      var dv=device();if(!dv){m.textContent='Could not read your device. Reload and try again.';return;}
      m.textContent='Counting your vote…';
      fetch(API+'/daily-poll',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({poll:D.poll.id,opt:+c.value,device:dv})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(x){
          if(!x.ok){m.textContent=(x.j&&x.j.error)||'Could not count the vote.';return;}
          try{localStorage.setItem(KEY,c.value);}catch(e){}m.textContent='Thank you. Your vote is in.';showRes(x.j);
        }).catch(function(){m.textContent='Could not reach the server. Try again.';});});
    var sb=$('#sbF');try{if(localStorage.getItem('amkh-daily-sub')){$('#sbMsg').textContent='You are subscribed. Thank you.';$('#sbMsg').style.color='#2f6b3a';}}catch(e){}
    sb.addEventListener('submit',function(e){e.preventDefault();var m=$('#sbMsg'),em=$('#sbMail').value.trim();
      if(!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(em)){m.style.color='#c8102e';m.textContent='Please check your email address.';return;}
      m.style.color='#6b6258';m.textContent='Subscribing…';
      fetch(API+'/daily-sub',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({email:em,name:$('#sbName').value.trim()})})
        .then(function(r){return r.json().then(function(j){return {ok:r.ok,j:j};});}).then(function(x){
          if(x.ok){m.style.color='#2f6b3a';m.textContent='Subscribed. Welcome to SRK DAILY.';try{localStorage.setItem('amkh-daily-sub','1');}catch(e){}}
          else{m.style.color='#c8102e';m.textContent=(x.j&&x.j.error)||'Could not subscribe. Try again.';}
        }).catch(function(){m.style.color='#c8102e';m.textContent='Could not reach the server. Try again.';});});
  }
  document.addEventListener('click',function(e){var b=e.target.closest('[data-sh]');if(!b)return;
    var x=P.filter(function(p){return p.id===b.dataset.sh;})[0],u='https://agarmainkinghota.com/srk-daily/s/'+x.id+'/';
    if(navigator.share)navigator.share({title:x.title,text:x.title,url:u}).catch(function(){});
    else window.open('https://wa.me/?text='+encodeURIComponent(x.title+' '+u),'_blank');});
  fetch('../data/srk-daily.json',{cache:'no-store'}).then(function(r){return r.json();}).then(function(d){
    D=d;P=d.posts.slice().sort(function(a,b){return a.date<b.date?1:a.date>b.date?-1:((a.n||9)-(b.n||9));});
    var one=new URLSearchParams(location.search).get('p'),x=one&&P.filter(function(p){return p.id===one;})[0];
    $('#npBody').innerHTML=x?article(D,x):front(D,P);
    if(!x)daily(D);
    // ?snap=1: the front page alone (no site header/footer), KING BUZZ open: used to make the daily link-preview snapshot
    if(!x&&new URLSearchParams(location.search).get('snap')){document.documentElement.classList.add('snap');$('#kb').hidden=false;kbLoad();}
    if(!x&&new URLSearchParams(location.search).get('pdf')){document.documentElement.classList.add('pdf-front');
      var ps=document.createElement('style');ps.textContent='@media print{@page{size:330mm 550mm;margin:0}}';document.head.appendChild(ps);/* one sheet whatever the length: the page grows to the paper's height (330 mm wide = 1247 px; +8% for the narrower print layout) */var fit=function(){var nb=document.getElementById('npBody');var hpx=(nb?nb.getBoundingClientRect().bottom+window.scrollY+40:document.documentElement.scrollHeight)*1247/Math.max(1,document.documentElement.clientWidth);var mm=Math.max(550,Math.ceil(hpx*0.2646*1.08)+10);ps.textContent='@media print{@page{size:330mm '+mm+'mm;margin:0}}';};setTimeout(fit,3000);setTimeout(fit,7000);
      $('#kb').hidden=false;kbLoad();
      var fix=function(){[].forEach.call(document.querySelectorAll('a[href]'),function(l){var h=l.getAttribute('href');if(/^https?:/i.test(h))return;l.setAttribute('href',new URL(h,'https://agarmainkinghota.com/srk-daily/').href);});};fix();setTimeout(fix,2500);setTimeout(fix,6000);}
    if(x)document.title=x.title+' — SRK DAILY';
    // PDF edition (?pdf=1): every link points at the live site, whatever host printed it
    if(new URLSearchParams(location.search).get('pdf'))[].forEach.call(document.querySelectorAll('a[href]'),function(l){var h=l.getAttribute('href');if(/^https?:/i.test(h))return;l.setAttribute('href',new URL(h,'https://agarmainkinghota.com/srk-daily/').href);});
    wire();
  });
})();
</script>
<script src="../assets/footer.js" defer></script>
</body>
